<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="clock-container">
        <div class="date-display" id = "date">FRIDAY, NOV 6, 2026</div>
        <div class ="time-display"><span id="hours">16</span>:<span id="minutes">10</span>:<span id="seconds">09</span>
        <span id="ampm"class="ampm">AM</span>
        </div>
        <button class="toggle-btn" id="formatToggle">Switch to 24H</button>
    </div>
</body>
</html>
